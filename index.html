<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salzig Süß</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Anton', sans-serif;
    }

    body {
      background: url('Sky.jpg') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2b2b2b;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .headline {
      font-family: 'Anton', sans-serif;
      font-size: clamp(3rem, 12vw, 9rem);
      color: #ff4500;
      text-transform: uppercase;
      letter-spacing: -2px;
      line-height: 0.9;
      text-shadow: -3px -3px 0 #fff300, 3px 3px 0 #000, 6px 6px 0 #ffb100;
      margin-top: 40px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2em;
      flex-wrap: wrap;
      position: relative;
      z-index: 5;
    }

    .headline span {
      display: inline-block;
      transform: skew(-3deg);
    }

    .subtext {
      font-family: 'Anton', sans-serif;
      font-size: clamp(0.8rem, 2vw, 1.2rem);
      color: #ff4500;
      text-align: center;
      margin-top: 25px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      z-index: 5;
    }

    .sticker {
      position: absolute;
      height: auto;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 10;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
      cursor: grab;
      pointer-events: auto;
    }

    .sticker:active {
      cursor: grabbing;
    }

    .link-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      flex-wrap: nowrap;
      flex-shrink: 0;
      text-align: center;
      white-space: nowrap;
    }

    .link-label {
      font-family: 'Anton', sans-serif;
      color: #ffb100;
      font-size: 1.5rem;
      text-shadow: 2px 2px 0 #000;
    }

    a {
      color: #ffffff;
      background-color: #ff2e00;
      padding: 10px 20px;
      text-decoration: none;
      font-weight: bold;
      border: 3px solid #ffb100;
      box-shadow: 3px 3px 0 #000;
      transition: transform 0.2s ease;
      margin: 0 10px;
      z-index: 10;
      position: relative;
      border-radius: 6px;
    }

    a:hover {
      transform: scale(1.05);
      background-color: #ffb100;
      color: #000;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay.hidden {
      display: none;
    }

    .text-box {
      background: linear-gradient(180deg, #f9f3d2 0%, #f6e6a7 100%);
      border: 2px solid #c28b00;
      border-radius: 20px;
      padding: 20px 30px;
      font-size: clamp(1rem, 2vw, 1.4rem);
      font-family: 'Anton', sans-serif;
      color: #4b2c00;
      max-width: 80%;
      max-height: 70vh;
      overflow: hidden;
      margin: auto;
      position: relative;
      z-index: 200;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      text-shadow: none;
      line-height: 1.4;
      text-align: center;
    }

    .text-box .scroll-content {
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 10px;
      text-align: center;
    }

    .text-box::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(to right, #d9480f, #f5b400);
      border-radius: 0 0 18px 18px;
      opacity: 0.8;
    }

    video {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    model-viewer {
      width: 80vw;
      height: 80vh;
      background: transparent;
    }

    .pixel-row {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: url('Pixel.png') repeat-x bottom;
      background-size: auto 50px;
      z-index: 5;
      pointer-events: none;
    }

    .back-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #ff4500;
      color: white;
      font-family: 'Anton', sans-serif;
      border: 2px solid #ffb100;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      z-index: 300;
      display: none;
    }

    .back-button:hover {
      background-color: #ffb100;
      color: #000;
    }

    .info-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #ff4500;
      color: #fff;
      border: 2px solid #ffb100;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      font-family: 'Anton', sans-serif;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      z-index: 300;
    }

    .info-button:hover {
      background-color: #ffb100;
      color: #000;
    }

    @media (max-width: 768px) {
      body { overflow: auto; }
      .sticker { transform: scale(1.2); }
      .link-container {
        flex-wrap: wrap;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        text-align: center;
      }
      .link-label { font-size: 1rem; }
      a { font-size: 0.9rem; padding: 8px 14px; }
      .headline { font-size: clamp(2rem, 10vw, 6rem); }
      .subtext { font-size: clamp(0.7rem, 1.8vw, 1rem); }
    }
  </style>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>
  <!-- 🟢 Info Button -->
  <button id="infoBtn" class="info-button">i</button>

  <div class="stage" id="stage">
    <h1 class="headline">
      <span>S🧂LZIG</span>&nbsp;<span>SÜSS</span>
    </h1>
    <div class="subtext">Klicke auf und bewege die Sticker</div>
  </div>

  <div class="link-container">
    <span class="link-label">weitere Projekte</span>
    <a href="https://schninnaa.github.io/Daisy/">Daisy</a>
    <a href="https://illuilya.github.io/AR-Website/">Ilya</a>
    <span class="link-label">von anderen Artists</span>
  </div>

  <div id="overlay" class="overlay hidden">
    <div id="content"></div>
    <button class="back-button" id="backBtn">Zurück</button>
  </div>

  <div class="pixel-row"></div>

  <script>
    const stickers = [
      {src: 'Salz.png', alt: 'Salz'},
      {src: 'Teufel.png', alt: 'Teufel'},
      {src: 'Lueneburg2.png', alt: 'Lueneburg2'},
      {src: 'Salzstein.png', alt: 'Salzstein'},
      {src: 'Buch.png', alt: 'Buch'},
      {src: 'Piskel.png', alt: 'Piskel'}
    ];

    const stage = document.getElementById('stage');
    const overlay = document.getElementById('overlay');
    const content = document.getElementById('content');
    const backBtn = document.getElementById('backBtn');
    const infoBtn = document.getElementById('infoBtn');

    const minVW = 10;
    const maxVW = 18;
    const rotRange = 25;

    // 🟢 Info Button Logik (mit MP4!)
    infoBtn.addEventListener('click', () => {
      if (!overlay.classList.contains('hidden') && content.dataset.type === 'info') {
        overlay.classList.add('hidden');
        content.innerHTML = '';
        return;
      }
      overlay.classList.remove('hidden');
      content.dataset.type = 'info';
      content.innerHTML = `
        <div class="text-box">
          <div class="scroll-content">
            Im Rahmen eines 3D Augmented Reality Kurses haben wir digitale 3D-Objekte erstellt und sie mithilfe von AR-Technologie auf dieser Website erlebbar gemacht. Ziel war es, virtuelle Elemente mit realen Orten zu verbinden und so historische oder thematische Bezüge sichtbar zu machen.<br><br>
            Ich habe mich für die Stadt Lüneburg entschieden – eine Stadt, die durch ihren Salzabbau über Jahrhunderte geprägt wurde. Meine 3D-Modelle, darunter Salzkristalle und weitere thematisch passende Objekte, greifen diesen historischen Hintergrund auf und machen die Geschichte des Salzes auf moderne, interaktive Weise erfahrbar.
            <video controls>
              <source src="3DVideo.mp4" type="video/mp4">
              Dein Browser unterstützt das Video-Format nicht.
            </video>
          </div>
        </div>`;
      const inner = content.firstElementChild;
      inner.addEventListener('click', e => e.stopPropagation());
    });

    // Sticker-Logik (unverändert)
    function isOverlapping(newBox, boxes) {
      return boxes.some(box => !(newBox.right < box.left || newBox.left > box.right || newBox.bottom < box.top || newBox.top > box.bottom));
    }
    function isWithinStage(box) {
      return box.left >= 0 && box.top >= 0 && box.right <= window.innerWidth && box.bottom <= window.innerHeight;
    }

    function placeSticker(item) {
      const img = new Image();
      img.className = 'sticker';
      img.src = item.src;
      img.alt = item.alt || '';
      let chosenVW = minVW + Math.random() * (maxVW - minVW);
      if (item.alt === 'Buch' || item.alt === 'Lueneburg2') chosenVW *= 1.4;
      img.style.width = chosenVW + 'vw';

      img.addEventListener('load', () => {
        const imgW = img.getBoundingClientRect().width;
        const imgH = img.getBoundingClientRect().height;
        const stageW = window.innerWidth;
        const stageH = window.innerHeight;
        const topBuffer = 120, bottomBuffer = 150, leftBuffer = 20, rightBuffer = 20;
        const placedBoxes = Array.from(document.querySelectorAll('.sticker')).map(el => el.getBoundingClientRect());
        let leftPx, topPx, newBox, attempts = 0;
        const minX = leftBuffer, maxX = stageW - imgW - rightBuffer;
        const minY = topBuffer, maxY = stageH - imgH - bottomBuffer;
        function biasedRandom(min, max) {
          const r = Math.random() * Math.random();
          const mid = (min + max) / 2;
          return Math.random() < 0.5 ? mid - r * (mid - min) : mid + r * (max - mid);
        }
        do {
          leftPx = biasedRandom(minX, maxX);
          topPx = biasedRandom(minY, maxY);
          newBox = {left: leftPx, top: topPx, right: leftPx + imgW, bottom: topPx + imgH};
          attempts++;
        } while ((isOverlapping(newBox, placedBoxes) || !isWithinStage(newBox)) && attempts < 1000);
        img.style.left = leftPx + 'px';
        img.style.top = topPx + 'px';
        const rot = (Math.random() * rotRange * 2) - rotRange;
        img.style.transform = `rotate(${rot}deg)`;
        makeDraggable(img, item);
        stage.appendChild(img);
      });
    }

    function makeDraggable(el, item) {
      let isDragging = false, startX = 0, startY = 0, offsetX = 0, offsetY = 0;
      el.addEventListener('pointerdown', e => {
        isDragging = true;
        el.setPointerCapture(e.pointerId);
        const rect = el.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        startX = e.clientX; startY = e.clientY;
      });
      el.addEventListener('pointermove', e => {
        if (!isDragging) return;
        const newLeft = Math.min(Math.max(e.clientX - offsetX, 0), window.innerWidth - el.offsetWidth);
        const newTop = Math.min(Math.max(e.clientY - offsetY, 0), window.innerHeight - el.offsetHeight);
        el.style.left = newLeft + 'px';
        el.style.top = newTop + 'px';
      });
      el.addEventListener('pointerup', e => {
        el.releasePointerCapture(e.pointerId);
        if (!isDragging) return;
        isDragging = false;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        const distance = Math.sqrt(dx*dx + dy*dy);
        if(distance < 5) { /* bestehende Sticker-Logik */ }
      });
    }

    stickers.forEach(item => placeSticker(item));

    overlay.addEventListener('click', e => {
      if (e.target === overlay) {
        overlay.classList.add('hidden');
        content.innerHTML = '';
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salzig Süß</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Anton', sans-serif;
    }

    body {
      background: url('Sky.jpg') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2b2b2b;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .headline {
      font-family: 'Anton', sans-serif;
      font-size: clamp(3rem, 12vw, 9rem);
      color: #ff4500;
      text-transform: uppercase;
      letter-spacing: -2px;
      line-height: 0.9;
      text-shadow: -3px -3px 0 #fff300, 3px 3px 0 #000, 6px 6px 0 #ffb100;
      margin-top: 40px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2em;
      flex-wrap: wrap;
      position: relative;
      z-index: 5;
    }

    .headline span {
      display: inline-block;
      transform: skew(-3deg);
    }

    /* Hinweistext etwas weiter unterhalb des Titels */
    .subtext {
      font-family: 'Anton', sans-serif;
      font-size: clamp(0.8rem, 2vw, 1.2rem);
      color: #ff4500;
      text-align: center;
      margin-top: 25px; /* weiter unten positioniert */
      margin-bottom: 20px;
      letter-spacing: 1px;
      z-index: 5;
    }

    .sticker {
      position: absolute;
      height: auto;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 10;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
      cursor: grab;
    }

    .sticker:active {
      cursor: grabbing;
    }

    /* Buttons über der Pixel-Leiste */
    .link-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    a {
      color: #ffffff;
      background-color: #ff2e00;
      padding: 10px 20px;
      text-decoration: none;
      font-weight: bold;
      border: 3px solid #ffb100;
      box-shadow: 3px 3px 0 #000;
      transition: transform 0.2s ease;
      margin: 0 10px;
      z-index: 10;
      position: relative;
      border-radius: 6px;
    }

    a:hover {
      transform: scale(1.05);
      background-color: #ffb100;
      color: #000;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay.hidden {
      display: none;
    }

    .text-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px) saturate(150%);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 30px 40px;
      font-size: 2rem;
      text-align: center;
      font-family: 'Anton', sans-serif;
      color: #fff;
      max-width: 80%;
      max-height: 70vh;
      overflow-y: auto;
      margin: auto;
      position: relative;
      z-index: 200;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .text-box:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      background: rgba(255, 255, 255, 0.15);
    }

    model-viewer {
      width: 80vw;
      height: 80vh;
      background: transparent;
    }

    .pixel-row {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: url('Pixel.png') repeat-x bottom;
      background-size: auto 50px;
      z-index: 20;
    }
  </style>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>
  <div class="stage" id="stage">
    <h1 class="headline">
      <span>S🧂LZIG</span>&nbsp;<span>SÜSS</span>
    </h1>
    <div class="subtext">Klicke auf und bewege die Sticker</div>
  </div>

  <div class="link-container">
    <a href="https://schninnaa.github.io/Daisy/">Daisy</a>
    <a href="https://illuilya.github.io/AR-Website/">Ilya</a>
  </div>

  <div id="overlay" class="overlay hidden">
    <div id="content"></div>
  </div>

  <div class="pixel-row"></div>

  <script>
    const stickers = [
      {src: 'Salz.png', alt: 'Salz'},
      {src: 'Teufel.png', alt: 'Teufel'},
      {src: 'Lueneburg2.png', alt: 'Lueneburg2'},
      {src: 'Salzstein.png', alt: 'Salzstein'},
      {src: 'Buch.png', alt: 'Buch'}
    ];

    const stage = document.getElementById('stage');
    const overlay = document.getElementById('overlay');
    const content = document.getElementById('content');

    const minVW = 10;
    const maxVW = 18;
    const rotRange = 25;

    function isOverlapping(newBox, boxes) {
      return boxes.some(box => {
        return !(newBox.right < box.left || newBox.left > box.right || newBox.bottom < box.top || newBox.top > box.bottom);
      });
    }

    function isWithinStage(box) {
      return box.left >= 0 && box.top >= 0 &&
             box.right <= window.innerWidth &&
             box.bottom <= window.innerHeight;
    }

    function placeSticker(item) {
      const img = new Image();
      img.className = 'sticker';
      img.src = item.src;
      img.alt = item.alt || '';

      let chosenVW = minVW + Math.random() * (maxVW - minVW);
      if (item.alt === 'Buch' || item.alt === 'Lueneburg2') {
        chosenVW *= 1.4;
      }
      img.style.width = chosenVW + 'vw';

      img.addEventListener('load', () => {
        const imgW = img.getBoundingClientRect().width;
        const imgH = img.getBoundingClientRect().height;
        const stageW = window.innerWidth;
        const stageH = window.innerHeight;

        const minX = stageW * 0.2;
        const maxX = stageW * 0.8 - imgW;
        const minY = stageH * 0.2;
        const maxY = stageH * 0.8 - imgH;

        const placedBoxes = Array.from(document.querySelectorAll('.sticker')).map(el => el.getBoundingClientRect());

        let leftPx, topPx, newBox, attempts = 0;
        do {
          leftPx = minX + Math.random() * (maxX - minX);
          topPx = minY + Math.random() * (maxY - minY);
          newBox = {left: leftPx, top: topPx, right: leftPx + imgW, bottom: topPx + imgH};
          attempts++;
        } while ((isOverlapping(newBox, placedBoxes) || !isWithinStage(newBox)) && attempts < 1000);

        img.style.left = leftPx + 'px';
        img.style.top = topPx + 'px';
        const rot = (Math.random() * rotRange * 2) - rotRange;
        img.style.transform = `rotate(${rot}deg)`;

        makeDraggable(img, item);
        stage.appendChild(img);
      });
    }

    function makeDraggable(el, item) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let offsetX = 0, offsetY = 0;

      el.addEventListener('pointerdown', e => {
        isDragging = true;
        el.setPointerCapture(e.pointerId);
        const rect = el.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        startX = e.clientX;
        startY = e.clientY;
      });

      el.addEventListener('pointermove', e => {
        if (!isDragging) return;
        const newLeft = Math.min(Math.max(e.clientX - offsetX, 0), window.innerWidth - el.offsetWidth);
        const newTop = Math.min(Math.max(e.clientY - offsetY, 0), window.innerHeight - el.offsetHeight);
        el.style.left = newLeft + 'px';
        el.style.top = newTop + 'px';
      });

      el.addEventListener('pointerup', e => {
        el.releasePointerCapture(e.pointerId);
        if (!isDragging) return;
        isDragging = false;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const distance = Math.sqrt(dx*dx + dy*dy);

        if(distance < 5) { 
          overlay.classList.remove('hidden');
          content.innerHTML = '';

          if(item.alt === 'Salzstein') {
            content.innerHTML = `
              <model-viewer 
                src="Szenario.glb" 
                ios-src="Szenario.usdz" 
                alt="3D Modell" 
                auto-rotate 
                camera-controls 
                ar 
                ar-modes="scene-viewer quick-look webxr" 
                environment-image="neutral" 
                background-color="0 transparent">
              </model-viewer>
            `;
          } 
          else if(item.alt === 'Salz') {
            content.innerHTML = `
              <model-viewer 
                src="Säulen2.glb" 
                ios-src="Säulen2.usdz" 
                alt="3D Modell" 
                auto-rotate 
                camera-controls 
                ar 
                ar-modes="scene-viewer quick-look webxr" 
                environment-image="neutral" 
                background-color="0 transparent">
              </model-viewer>
            `;
          }
          else if(item.alt === 'Buch') {
            content.innerHTML = `<div class="text-box">Woher kommt eigentlich das lebenserhaltende und kulinarisch wertvolle Salz, das wir tagtäglich benutzen?</div>`;
          }
          else if(item.alt === 'Lueneburg2') {
            content.innerHTML = `<div class="text-box">Unter Lüneburg liegt ein Schatz: das Salz, das die Stadt reich machte – und zugleich ihr Schicksal besiegelte. Wo einst Sole abgepumpt wurde, blieben Hohlräume zurück. Heute sinkt die Altstadt, Straßen kippen, Häuser neigen sich.</div>`;
          }
          else if(item.alt === 'Teufel') {
            content.innerHTML = `<div class="text-box">Die Lüneburger nennen die Kräfte im Untergrund „Senkungsteufel“. In alten Berichten klingt es, als tobten dort Kobolde, die Häuser verschieben und Straßen zerreißen.</div>`;
          }
          else {
            content.innerHTML = `<div class="text-box">Hier könnte Text oder ein anderes 3D-Modell angezeigt werden.</div>`;
          }
        }
      });
    }

    stickers.forEach(item => placeSticker(item));

    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      content.innerHTML = '';
    });
  </script>
</body>
</html>
